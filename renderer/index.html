<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <link rel="stylesheet"  href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
  <div class="controls">
    <button id="add-habit-btn">+ Add New Habit</button>
  </div>

  <div id="habits-wrapper"></div>
  <span>Don't mind what's below</span>
  <h1 id="habit-name-txt" contenteditable="true">Habit 1</h1>
  <div class="graph-container">
    <table class="contribution-table">
      <thead>
      </thead>
      <tbody id="habit-body">
      </tbody>
    </table>
  </div>

  <template id="habit-template">
    <div class="habit-card">
      <h1 class="habit-name-txt" contenteditable="true">New Habit (Click to edit)</h1>
      <div class="graph-container">
        <table class="contribution-table">
          <thead></thead>
          <tbody class="habit-body"></tbody>
        </table>
      </div>
      <button class="delete-habit-btn">Delete Habit</button>
    </div>
  </template>
  <div id="global-tooltip" class="github-tooltip">hi</div>

  <div>
    <h3>Electron IPC Communication Test</h3>
    <button id="test-btn">Ping Backend</button>
    <p>Backend Status: <span id="test-status">Waiting for click...</span></p>
  </div>
  <script src="app.js" type="module"></script>
</body>
</html>
