<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blocks</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <link rel="stylesheet"  href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
  <div class="controls">
    <button id="add-habit-btn">+ Add New Habit</button>
  </div>

  <div id="habits-wrapper"></div>

  <template id="habit-template">
    <div class="habit-card">
      <div class="title-delete">
        <h1 class="habit-name-txt" contenteditable="true">New Habit (Click to edit)</h1>
        <button class="delete-habit-btn">Delete Habit</button>
      </div>
      <div class="graph-container">
        <table class="contribution-table">
          <thead></thead>
          <tbody class="habit-body"></tbody>
        </table>
      </div>
    </div>
  </template>
  <div id="global-tooltip" class="github-tooltip">hi</div>

  <footer class="dev-footer">
    <p>&copy; 2026 • Developed with ❤️ by <span class="dev-name">Jaz Iloso</span></p>
  </footer>

  <script src="app.js" type="module"></script>
</body>
</html>
